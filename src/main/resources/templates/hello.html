<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="https://www.thymeleaf.org/thymeleaf-extras-springsecurity6">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hello - Basketball DB</title>
  <link th:href="@{/css/tailwind.min.css}" rel="stylesheet">
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center">

  <div class="bg-white p-10 rounded-xl shadow-lg text-center w-full max-w-md">
    <h1 class="text-3xl font-bold text-blue-600 mb-6" th:inline="text">
      Hello <span th:remove="tag" sec:authentication="name">User</span>!
    </h1>

    <form th:action="@{/logout}" method="post">
      <button type="submit" class="bg-red-500 text-white py-2 px-6 rounded hover:bg-red-600 transition">
        Sign Out
      </button>
    </form>
  </div>

</body>
</html>
