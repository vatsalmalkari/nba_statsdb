<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Home - Basketball DB</title>
  <link th:href="@{/css/tailwind.min.css}" rel="stylesheet">
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center">

  <div class="bg-white p-10 rounded-xl shadow-lg text-center w-full max-w-md">
    <h1 class="text-3xl font-bold text-blue-600 mb-6">Welcome to Basketball DB!</h1>
    <p class="text-gray-700 mb-4">
      Click <a th:href="@{/hello}" class="text-blue-500 underline hover:text-blue-700">here</a> to see a secured greeting.
    </p>
    <p class="text-gray-700">
      If you need to log in, visit the <a th:href="@{/login}" class="text-blue-500 underline hover:text-blue-700">login page</a>.
    </p>
  </div>

</body>
</html>
