<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Basketball DB</title>
  <link th:href="@{/css/tailwind.min.css}" rel="stylesheet">
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center">

  <div class="bg-white p-8 rounded-xl shadow-lg w-full max-w-sm">
    <h1 class="text-2xl font-bold text-gray-800 mb-6 text-center">Sign In</h1>

    <!-- Error Message -->
    <div th:if="${param.error}" class="bg-red-100 text-red-700 p-3 rounded mb-4 text-center">
      Invalid username or password.
    </div>

    <!-- Logout Message -->
    <div th:if="${param.logout}" class="bg-green-100 text-green-700 p-3 rounded mb-4 text-center">
      You have been logged out.
    </div>

    <!-- Default Credentials -->
    <div class="bg-gray-100 p-3 rounded mb-6 text-sm text-gray-700">
      <strong>Default Credentials:</strong><br>
      Username: <strong>user</strong><br>
      Password: <strong>password</strong>
    </div>

    <form th:action="@{/login}" method="post" class="space-y-4">
      <div>
        <label for="username" class="block text-gray-600 mb-1">Username</label>
        <input type="text" id="username" name="username" required
               class="w-full p-2 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-blue-400">
      </div>
      <div>
        <label for="password" class="block text-gray-600 mb-1">Password</label>
        <input type="password" id="password" name="password" required
               class="w-full p-2 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-blue-400">
      </div>
      <div>
        <button type="submit" class="w-full bg-blue-600 text-white py-2 rounded hover:bg-blue-700 transition">Sign In</button>
      </div>
    </form>
  </div>

</body>
</html>
