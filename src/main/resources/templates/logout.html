<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Logging Out...</title>
  <link th:href="@{/css/tailwind.min.css}" rel="stylesheet">
  <script>
  
    localStorage.removeItem('jwtToken');
    
    
    setTimeout(() => {
      window.location.href = '/login';
    }, 2000);
  </script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center">

  <div class="bg-white p-8 rounded-xl shadow-lg text-center w-full max-w-sm">
    <h1 class="text-2xl font-bold text-gray-800 mb-4">Logging Out...</h1>
    <p class="text-gray-600 mb-6">You are being redirected to the login page.</p>

    <div class="flex justify-center">
      <div class="w-10 h-10 border-4 border-blue-400 border-dashed rounded-full animate-spin"></div>
    </div>
  </div>

</body>
</html>
